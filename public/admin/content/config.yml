                  ]
                },
                {
                  "name": "property_name",
                  "label": "Property name",
                  "widget": "string"
                },
                {
                  "name": "unit_type",
                  "label": "unit type",
                  "widget": "select",
                  "options": [
                    "apartment",
                    "townhouse",
                    "townhome-style-apartment"
                  ]
                },
                {
                  "name": "address_line",
                  "label": "Street address",
                  "widget": "string"
                },
                {
                  "name": "city",
                  "label": "City",
                  "widget": "string"
                },
                {
                  "name": "county",
                  "label": "County",
                  "widget": "string"
                },
                {
                  "name": "state",
                  "label": "state",
