{
  "backend": {
    "name": "github",
    "repo": "Tyrrellkdlemons/lightning-mcgreen-living",
    "branch": "main",
    "site_domain": "lightning-mcgreen-living.netlify.app"
  },
  "publish_mode": "editorial_workflow",
  "media_folder": "public/content-media",
  "public_folder": "/content-media",
  "media_library": {
    "name": "managed-place-photos"
  },
  "site_url": "https://lightning-mcgreen-living.netlify.app",
  "display_url": "https://lightning-mcgreen-living.netlify.app",
  "show_preview_links": true,
  "collections": [
    {
      "name": "places",
      "label": "City guides",
      "description": "Edit the real California and Arizona city registry. Existing IDs and city URLs stay stable. Save a draft and review its GitHub pull request.",
      "format": "places-array",
      "publish": false,
      "delete": false,
      "editor": {
        "preview": false
      },
      "files": [
        {
          "name": "places",
          "label": "Places",
          "file": "src/lib/places/places.json",
          "fields": [
            {
              "name": "places",
              "label": "City guides",
              "widget": "list",
              "summary": "{{fields.name}}, {{fields.state}}",
              "collapsed": true,
              "fields": [
                {
                  "name": "id",
                  "widget": "hidden",
                  "default": ""
                },
                {
                  "name": "slug",
                  "label": "City URL slug",
                  "widget": "string"
                },
                {
                  "name": "name",
                  "label": "City",
                  "widget": "string"
                },
                {
                  "name": "state",
                  "label": "state",
                  "widget": "select",
                  "options": [
                    "CA",
                    "AZ"
                  ]
                },
                {
                  "name": "county",
                  "label": "County",
                  "widget": "string"
                },
                {
                  "name": "region",
                  "label": "Region",
                  "widget": "string"
                },
                {
                  "name": "description",
                  "label": "Planning introduction",
                  "widget": "text",
                  "hint": "At least 51 characters; describe the city without inventing property availability."
                },
                {
                  "name": "planningTips",
                  "label": "Planning tips",
                  "widget": "list",
                  "min": 2,
                  "max": 12,
                  "field": {
                    "name": "tip",
                    "label": "Tip",
                    "widget": "string"
                  }
                },
                {
                  "name": "sourceUrl",
                  "label": "Public resource URL (HTTPS)",
                  "widget": "string"
                },
                {
                  "name": "sourcePublisher",
                  "label": "Source publisher",
                  "widget": "string"
                },
                {
                  "name": "contentKind",
                  "widget": "hidden",
                  "default": "planning-guide"
                }
              ]
            }
          ]
        }
      ]
    },
    {
      "name": "inventory",
      "label": "Rentals, dealers & vehicles",
      "description": "Supplemental inventory displayed in site searches after the reviewed pull request is merged and deployed. Original listings and the 79-property workbook are maintained separately.",
