              "fields": [
                {
                  "name": "id",
                  "widget": "hidden",
                  "default": ""
                },
                {
                  "name": "slug",
                  "label": "City URL slug",
                  "widget": "string"
                },
                {
                  "name": "name",
                  "label": "City",
                  "widget": "string"
                },
                {
                  "name": "state",
                  "label": "state",
                  "widget": "select",
                  "options": [
                    "CA",
                    "AZ"
                  ]
                },
                {
                  "name": "county",
                  "label": "County",
                  "widget": "string"
                },
                {
                  "name": "region",
                  "label": "Region",
                  "widget": "string"
                },
                {
                  "name": "description",
                  "label": "Planning introduction",
                  "widget": "text",
                  "hint": "At least 51 characters; describe the city without inventing property availability."
