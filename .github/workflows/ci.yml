name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-typecheck-build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Regression checks
        run: |
          node scripts/test-compliance.mjs
          node scripts/test-static-scan.mjs
          node scripts/test-cms.mjs
          node scripts/test-property-views.mjs
          node scripts/test-assistance.mjs
          node scripts/test-streetview.mjs
          node scripts/test-resource-catalog.mjs
          node scripts/test-link-routing.mjs
          node --test scripts/test-photos.mjs

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_DATA_MODE: demo
          NEXT_PUBLIC_GEOFENCE_SOCAL: 'true'
          ADMIN_SHARED_SECRET: 'ci-only-not-a-real-secret'
        run: npm run build

  brand-and-fair-housing-check:
    name: Brand + Fair Housing scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan required files, brand, housing copy and guarantees
        run: node scripts/validate.mjs
