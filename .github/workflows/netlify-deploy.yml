name: CI + Netlify Deploy

# Mirrors The Last Mile / Emailer pattern: validate → deploy on main, preview
# deploys on PRs with a comment containing the preview URL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate · lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Validate static checks
        run: node ./scripts/validate.mjs

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck

      - name: Build Next.js
        env:
          NEXT_PUBLIC_DATA_MODE: demo
          NEXT_PUBLIC_GEOFENCE_SOCAL: 'true'
          ADMIN_SHARED_SECRET: ci-placeholder-not-a-real-secret
        run: npm run build

  deploy:
    name: Deploy to Netlify (production)
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest
      - name: Deploy to production
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --build \
            --prod \
            --message "GitHub Actions $(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ github.sha }}"

  preview:
    name: Deploy preview (PR)
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest
      - name: Deploy preview
        id: deploy
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          OUT=$(netlify deploy --build --json)
          URL=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);console.log(j.deploy_url||j.url||'');});")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview link
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔗 Lightning McGreen Living preview deployed: ${{ steps.deploy.outputs.url }}`
            })
