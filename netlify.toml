# =============================================================================
# Lightning McGreen Living — Netlify configuration
# Mirrors the conventions in CLAUDE/Crypto Site (vaultkit) and CLAUDE/The Last Mile.
# =============================================================================

[build]
  command   = "npm install --no-audit --no-fund && npm run build"
  publish   = ".next"
  functions = ".netlify/functions"

[build.environment]
  # Production by default. Flip back to "demo" only if you want the
  # red banner + the Demo-mode disclosures back on every page.
  NEXT_PUBLIC_DATA_MODE       = "production"
  NEXT_PUBLIC_GEOFENCE_SOCAL  = "true"
  NODE_VERSION                = "20"

  # Match Crypto Site / vaultkit conventions
  NEXT_TELEMETRY_DISABLED     = "1"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Force esbuild for functions so dependencies bundle cleanly under Node 20
[functions]
  node_bundler = "esbuild"

# Next.js plugin handles App Router, ISR, middleware, image optimization
[[plugins]]
  package = "@netlify/plugin-nextjs"

# -----------------------------------------------------------------------------
# Headers — security defaults + cache rules
# -----------------------------------------------------------------------------

# Belt-and-braces security headers (also set in next.config.mjs)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "camera=(), microphone=(), geolocation=(self)"

# Long-cache static assets
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control          = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Admin endpoints must never be cached (mirrors Crypto Site pattern)
[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/api/vin/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Search results page should be fresh
[[headers]]
  for = "/search"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
