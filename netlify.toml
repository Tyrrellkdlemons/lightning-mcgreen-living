# Lightning McGreen Living — Netlify configuration
# Deploy: `netlify deploy --prod` (after `netlify init`)

[build]
  command   = "npm run build"
  publish   = ".next"
  functions = ".netlify/functions"

[build.environment]
  NEXT_PUBLIC_DATA_MODE     = "demo"          # flip to "production" once real data is in
  NEXT_PUBLIC_GEOFENCE_SOCAL = "true"
  NODE_VERSION              = "20"

# Use the Next.js plugin for App Router + image optimization
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-cache static assets
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control       = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Redirect /admin to a static gate notice on Netlify previews
[[redirects]]
  from   = "/admin"
  to     = "/admin"
  status = 200
  force  = false
